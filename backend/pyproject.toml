# Tool configuration only; dependencies are pinned in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Prompt prose reads better unwrapped.
"assistant/prompt.py" = ["E501"]
"scripts/create_elevenlabs_agent.py" = ["E501"]
