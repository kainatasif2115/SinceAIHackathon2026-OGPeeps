# Local MongoDB for development: `make db` (or `docker compose up -d mongo`).
# Then set MONGODB_URI=mongodb://localhost:27017 in backend/.env.
services:
  mongo:
    image: mongo:7.0  # 8.x crashes on Linux kernels 6.19+ (SERVER-121912)
    container_name: ogpeeps-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
